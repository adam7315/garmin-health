name: Update Garmin Dashboard

on:
  workflow_dispatch:
    inputs:
      fetch_days:
        description: '回填天數（預設 60，首次全量請填 1825）'
        required: false
        default: '60'
  schedule:
    - cron: '0 0 * * *'   # UTC 00:00 = Taiwan 08:00

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore token
        id: token-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/garmin_tokens
          key: garmin-token-${{ github.run_id }}
          restore-keys: |
            garmin-token-

      - name: Bootstrap token from secret
        if: steps.token-cache.outputs.cache-hit != 'true'
        env:
          GARMIN_TOKEN: ${{ secrets.GARMIN_TOKEN }}
        run: |
          mkdir -p /tmp/garmin_tokens
          if [ -n "$GARMIN_TOKEN" ]; then
            echo "$GARMIN_TOKEN" | base64 -d | tar -xz -C /tmp/garmin_tokens 2>/dev/null || true
            echo "Token bootstrapped from secret"
          else
            echo "No bootstrap token"
          fi

      - name: Fetch Garmin data
        env:
          GARMIN_EMAIL:    ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKEN_DIR: /tmp/garmin_tokens
          GARMIN_DATA_FILE: garmin_data.json
          FETCH_DAYS: ${{ github.event.inputs.fetch_days || '60' }}
        run: python garmin_fetch.py

      - name: Save token
        uses: actions/cache/save@v4
        with:
          path: /tmp/garmin_tokens
          key: garmin-token-${{ github.run_id }}

      - name: Generate dashboard
        env:
          GARMIN_DATA_FILE: garmin_data.json
          GARMIN_OUTPUT: index.html
        run: python garmin_viz.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add garmin_data.json index.html
          git diff --staged --quiet || git commit -m "Auto update $(date +'%Y-%m-%d %H:%M')"
          git push
